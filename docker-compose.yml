version: "3.9"


services:


  postgres:

    image: postgres:16

    container_name: titan-postgres

    restart: always


    environment:

      POSTGRES_USER: titan

      POSTGRES_PASSWORD: titan_password

      POSTGRES_DB: titan_ai


    ports:

      - "5432:5432"


    volumes:

      - postgres_data:/var/lib/postgresql/data





  backend:


    build:

      context: ./backend


    container_name: titan-backend


    restart: always


    depends_on:

      - postgres


    environment:


      DATABASE_URL:

        postgresql://titan:titan_password@postgres:5432/titan_ai


    ports:

      - "8000:8000"





  dashboard:


    build:

      context: ./dashboard


    container_name: titan-dashboard


    restart: always


    depends_on:

      - backend


    ports:

      - "3000:3000"



volumes:


  postgres_data:
