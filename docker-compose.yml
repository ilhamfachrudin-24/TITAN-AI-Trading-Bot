version: "3.9"


services:


  postgres:

    image: postgres:16


    container_name: titan-postgres


    restart: always


    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: titan


    ports:

      - "5432:5432"


    volumes:

      - postgres_data:/var/lib/postgresql/data



  backend:


    build:

      context: .


      dockerfile: Dockerfile



    container_name: titan-backend


    restart: always


    depends_on:

      - postgres



    environment:


      DATABASE_URL:

        postgresql://postgres:postgres@postgres:5432/titan



    ports:

      - "8000:8000"



volumes:


  postgres_data:
